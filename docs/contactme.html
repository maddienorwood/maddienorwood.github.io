  <main>
    <section class="mobile">
        <h1>Want to Talk?</h1>
        <p>I'd <span>love to get in touch</span>! Fill out the form to <span>send me a message</span>, or <span>use the contact links below</span>.</p>

        <form id="contactform" method="POST" action="https://api.web3forms.com/submit">
            <div>
                <input type="hidden" name="access_key" value="0508c4eb-ad34-44a5-8632-0298c3789258">
            </div>
            <div>
                <label for="first_name">First Name</label>
                <input type="text" minlength="1" name="first_name" id="first_name" placeholder="SpongeBob" required>
            </div>
            <div>
                <label for="last_name">Last Name</label>
                <input type="text" minlength="1" name="last_name" id="last_name" placeholder="SquarePants" required>
            </div>
            <div>
                <label for="company">Company Name</label>
                <input type="text" name="company" id="company" placeholder="Krusty Krab">
            </div>
            <div>
                <label for="email">Email Address</label>
                <input type="email" name="email" id="email" placeholder="spongebob@krustykrab.com" required>
            </div>
            <div>
                <label for="phone">Phone Number</label>
                <input type="tel" name="phone" id="phone" placeholder="(555) 123-4567">
            </div>
            <div>
                <label for="message">Your Message</label>
                <textarea name="message" id="message" rows="10" cols="40" placeholder="I'm ready!" required></textarea>
            </div>
            <div id="submit">
                <button>Submit</button>
            </div>
        </form>
    </section>
    <br>
  </main>
